server {
    listen 80;
    server_name api.statanly.com;

    return 308 https://api.statanly.com:9403$request_uri;
}

server {
    listen 443 ssl;
    server_name api.statanly.com;

    client_max_body_size 30m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 9403;

    location = /media {
        return 301 /media/;
    }

    location /media/ {
        set $seaweed_upstream http://seaweed-filer:8888;
        rewrite ^/media/(.*)$ /stylist-media/$1 break;
        proxy_pass $seaweed_upstream;
        proxy_buffering off;
    }

    location /stylist-media/ {
        set $seaweed_upstream http://seaweed-filer:8888;
        proxy_pass $seaweed_upstream;
        proxy_buffering off;
    }

    location /seaweedfsstatic/ {
        set $seaweed_upstream http://seaweed-filer:8888;
        proxy_pass $seaweed_upstream;
        proxy_buffering off;
    }

    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
