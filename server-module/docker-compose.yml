services:
  db:
    image: postgres:16
    container_name: stylist_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stylist
      POSTGRES_USER: stylist
      POSTGRES_PASSWORD: stylist
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: stylist_seaweed_master
    restart: unless-stopped
    command: 'master -ip=seaweed-master -ip.bind=0.0.0.0 -mdir=/data -port=9333'
    expose:
      - "9333"
    volumes:
      - seaweed_master_data:/data

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: stylist_seaweed_volume
    restart: unless-stopped
    command: 'volume -ip=seaweed-volume -ip.bind=0.0.0.0 -dir=/data -port=8080 -mserver=seaweed-master:9333'
    depends_on:
      - seaweed-master
    volumes:
      - seaweed_volume_data:/data

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: stylist_seaweed_filer
    restart: unless-stopped
    command: 'filer -ip=seaweed-filer -ip.bind=0.0.0.0 -master=seaweed-master:9333'
    expose:
      - "8888"
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed_filer_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 10s

  image-processing:
    build:
      context: ../image-processing-module
    container_name: stylist_image_processing
    restart: unless-stopped
    environment:
      YOLO_WEIGHTS_PATH: /app/models/best.pt
    expose:
      - "8001"
    volumes:
      - ../image-processing-module/models:/app/models:ro

  api:
    build:
      context: ./backend
    container_name: stylist_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://stylist:stylist@db:5432/stylist
      MEDIA_ROOT: /data/uploads
      BASE_URL: https://api.statanly.com:9403
      STORAGE_BACKEND: seaweedfs
      SEAWEEDFS_FILER_URL: http://seaweed-filer:8888
      SEAWEEDFS_COLLECTION: stylist-media
      SEAWEEDFS_TIMEOUT: "5"
      SEAWEEDFS_RETRIES: "90"
      SEAWEEDFS_RETRY_DELAY: "1"
      ML_SERVICE_URL: http://image-processing:8001
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./uploads:/seed/uploads:ro
    depends_on:
      db:
        condition: service_started
      seaweed-filer:
        condition: service_healthy
      image-processing:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: stylist_nginx
    restart: unless-stopped
    ports:
      - "9403:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
      seaweed-filer:
        condition: service_healthy

volumes:
  pgdata:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
